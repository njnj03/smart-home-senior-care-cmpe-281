# Nginx configuration for Frontend
# Place this file at /etc/nginx/sites-available/smart-home-frontend
# Then create symlink: sudo ln -s /etc/nginx/sites-available/smart-home-frontend /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name YOUR_EC2_IP;  # Replace with your EC2 public IP or domain

    root /opt/smart-home-frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Frontend routes - SPA support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase timeouts for ML inference
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        
        # Increase body size for file uploads
        client_max_body_size 50M;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /api/v1/health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }
}

